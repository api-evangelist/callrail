description: >-
  Binds each published CallRail MCP tool to the CallRail v3 REST operation it wraps. CallRail's own
  docs state the MCP server "acts as a proxy to the CallRail API", so every tool has a REST
  counterpart in the published v3 reference. Only 8 of those operations are currently captured as
  OpenAPI operationIds in this repo (accounts + calls); for every other tool the backing REST
  surface is identified by its documented method + path instead, and confidence is set accordingly.
  No tool, field, or operationId below was invented — MCP tools come from the docs' Available Tools
  tables, operationIds were grepped from the specs, and paths come from the docs' API Endpoint
  tables and curl examples.
surfaces:
  openapi:
    files:
      - file: openapi/callrail-accounts-api-openapi.yml
        operations: 2
      - file: openapi/callrail-calls-api-openapi.yml
        operations: 6
    note: >-
      Partial coverage of the published v3 surface. The REST reference at
      https://apidocs.callrail.com/ documents ~14 resource families (accounts, calls, tags,
      companies, form submissions, integrations, integration filters, notifications, outbound
      caller IDs, page views, SMS threads, summary emails, text messages, message flows, trackers,
      users, leads, lead timelines); CallRail publishes no OpenAPI of its own.
  graphql:
    endpoint: null
    note: CallRail publishes no GraphQL surface.
  mcp:
    endpoint: null
    gated: true
    note: >-
      Remote MCP server; endpoint URL is issued per account by CallRail and is not published, so
      tools/list could not be introspected. Tool names/descriptions transcribed from the docs.
