generated: '2026-08-14'
method: searched
source: https://apidocs.callrail.com/#http-response-codes
format: http-status
rfc9457: false
description: >-
  CallRail publishes a single HTTP status-code table for the whole v3 API. There is no RFC 9457
  problem+json media type, no stable `type` URI per error, and no numeric application error-code
  registry — the docs say only that "extra information about what went wrong will be encoded in the
  response as JSON". The entries below are the published status codes and their published meanings,
  verbatim; the `source_operation` values are the operations in this repo's OpenAPI that declare
  the matching response.
envelope:
  media_type: application/json
  shape: unpublished
  note: CallRail does not publish the error body schema.
problems:
  - status: 400
    title: Bad Request
    detail: >-
      The server cannot or will not process the request due to something that is perceived to be a
      client error (e.g., malformed request syntax, or invalid request parameters).
    remediation: Validate request syntax and parameters before retrying; retrying unchanged will fail again.
  - status: 401
    title: Unauthorized
    detail: The request has not been processed because it lacks a valid API key for the target resource.
    remediation: >-
      Send `Authorization: Token token="YOUR_API_KEY"`. Confirm the key belongs to a user with
      access to the target account/company — key scope equals user scope.
    source_operation:
      - openapi/callrail-accounts-api-openapi.yml#listAccounts
      - openapi/callrail-accounts-api-openapi.yml#getAccount
      - openapi/callrail-calls-api-openapi.yml#listCalls
      - openapi/callrail-calls-api-openapi.yml#getCall
  - status: 403
    title: Forbidden
    detail: The server understood the request but refuses to authorize it.
    remediation: The key is valid but the user lacks permission on this resource. Use a key for a user with access.
  - status: 404
    title: Not Found
    detail: The server did not find the target resource or endpoint.
    remediation: Check the account/resource id and that the path ends in `.json`.
    source_operation:
      - openapi/callrail-accounts-api-openapi.yml#getAccount
      - openapi/callrail-calls-api-openapi.yml#getCall
  - status: 405
    title: Method Not Allowed
    detail: >-
      The HTTP method received in the request is known by the origin server but not supported by
      the target resource.
    remediation: CallRail supports GET/POST/PUT/DELETE only — there is no PATCH; use PUT for updates.
  - status: 406
    title: Not Acceptable
    detail: >-
      Request parameters were supplied in an unacceptable format. For GET requests, verify that
      parameters are sent as part of the URL. For other requests, verify that parameters are sent
      as JSON.
    remediation: Query string for GET; JSON body for POST/PUT.
  - status: 422
    title: Unprocessable Entity
    detail: >-
      The server cannot or will not process the request due to something that is perceived to be a
      client error (e.g., malformed request syntax, or invalid request parameters).
    remediation: Semantic validation failure — inspect the JSON body for the specific field.
  - status: 429
    title: Too Many Requests
    detail: The User or Agency has sent too many requests in a given amount of time.
    remediation: >-
      Pause or slow requests until the 429 clears. No Retry-After header is sent — back off on a
      client-side schedule. Default ceilings are 1,000/hour and 10,000/day for general requests.
    see_also: rate-limits/callrail-rate-limits.yml
    source_operation:
      - openapi/callrail-accounts-api-openapi.yml#listAccounts
      - openapi/callrail-calls-api-openapi.yml#listCalls
  - status: 500
    title: Internal Server Error
    detail: >-
      The server encountered an unexpected condition that prevented it from fulfilling the request.
      If this error persists, please contact support.
    remediation: Retry with backoff; escalate to support if persistent.
  - status: 503
    title: Service Unavailable
    detail: The CallRail API is temporarily offline for maintenance, or the server is overloaded.
    remediation: Retry later; check https://status.callrail.com/.
success_codes:
  - {status: 200, title: OK, detail: The request has succeeded.}
  - {status: 201, title: Created, detail: The request has been fulfilled and has resulted in a new resource being created.}
  - {status: 204, title: No Content, detail: The server successfully processed the request and is not returning any content.}
domain_errors:
  - condition: Date range outside the data retention window
    detail: >-
      Communication Records (calls, recordings, text messages, chat logs, form submissions, web
      visitor sessions) are retained 25 months. Requesting records outside that window — including
      via the `all_time` date parameter — returns an error directing you to revise your date range.
    source: https://apidocs.callrail.com/#changelog (April 13, 2023)
gaps:
  - No machine-readable error catalog or per-error `code` registry is published.
  - No error response body schema is published, so clients cannot bind to a stable error shape.
  - No `application/problem+json` support (RFC 9457).
