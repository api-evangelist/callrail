        Not published by CallRail. Reconstructed from the public v3 reference at
        https://apidocs.callrail.com/.
  - target: $.info
    update:
      x-idempotency: none
      x-idempotency-note: >-
        No idempotency key. Retrying POST /a/{account_id}/calls.json can place a second real
        outbound phone call.
      x-data-retention:
        window_months: 25
        note: >-
          Communication Records older than 25 months are deleted; requests for ranges outside the
          window (including all_time) return an error.
  - target: $.paths['/a/{account_id}/calls.json'].get
    update:
      x-pagination:
        styles: [offset, relative]
