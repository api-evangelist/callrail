overlay: 1.0.0
info:
  title: API Evangelist enhancements for CallRail Calls API
  version: 1.0.0
extends: openapi/callrail-calls-api-openapi.yml
x-provenance:
  generated: '2026-08-14'
  method: generated
  source: >-
    Derived from https://apidocs.callrail.com/ during the API Evangelist enrichment pass. CallRail
    publishes no OpenAPI of its own; this overlay records API Evangelist annotations without
    mutating the spec file.
actions:
  - target: $.info
    update:
      x-apievangelist-provider: callrail
      x-apievangelist-artifacts:
        conventions: conventions/callrail-conventions.yml
        errors: errors/callrail-problem-types.yml
