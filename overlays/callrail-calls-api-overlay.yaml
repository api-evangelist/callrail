      x-entitlement:
        transcription: Premium Conversation Intelligence
        sentiment: Premium Conversation Intelligence
      x-rate-limit:
        hourly: 1000
        daily: 10000
  - target: $.paths['/a/{account_id}/calls.json'].post
    update:
      x-consequence: physical
      x-consequence-note: Places a real outbound phone call. Not idempotent, not reversible.
      x-rate-limit:
        hourly: 100
        daily: 2000
        name: Outbound Call
  - target: $.paths['/a/{account_id}/calls/{call_id}.json'].get
    update:
      x-field-selection: [person_id, sentiment, transcription, conversational_transcript, zip_code]
      x-entitlement:
        transcription: Premium Conversation Intelligence
        conversational_transcript: Premium Conversation Intelligence
        sentiment: Premium Conversation Intelligence
  - target: $.paths['/a/{account_id}/calls/{call_id}.json'].put
    update:
      x-editable-fields: [customer_name, note, tags, value, spam]
      x-webhook-effect: >-
        Triggers the Call Modified webhook, whose `changes` array names the fields that changed.
