data_retention:
  policy: >-
    Communication Records — phone calls, call recordings, text messages, chat logs, form
    submissions, web visitor sessions and other data types — are retained for 25 months and then
    automatically deleted.
  api_effect: >-
    Requests to Communication Record endpoints for dates outside the retention window, including
    requests using the `all_time` date parameter, return an error directing you to revise the date
    range. This is a hard, dated boundary on what any integration or agent can read.
