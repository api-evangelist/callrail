enterprise:
  available: true
  url: https://www.callrail.com/enterprise
  note: Contact-sales tier alongside the published self-serve plans.
billing_terms:
  overage_policy: >-
    "We'll continue to track your leads, but additional minutes and numbers not included in the
    chosen plan will be billed in addition to your base fee. These additional fees are not
    refundable under any circumstances but you can always upgrade your pricing plan as your
    business grows."
  monthly: >-
    Each month CallRail invoices the base fee for the upcoming month plus the additional usage from
    the previous month, on the customer's signup anniversary day.
  annual: >-
    The base fee for the upcoming 12 months is due on payment-method entry; additional usage for
    each previous month is billed monthly on the same day.
  minute_rounding: Minutes are calculated by rounding each call up to the nearest minute, then summing.
