description: >-
  CallRail publishes public, self-serve list pricing for four packaged plans plus an AI Voice
  Assistant add-on. Plans are priced per month with a yearly/monthly toggle (CallRail advertises
  "save up to 10% with a yearly plan"); the prices below are the figures rendered on the public
  pricing page. Every plan is metered — the base fee includes 5 tracking numbers and 250 minutes,
  and usage beyond that is billed in addition to the base fee. All plans carry a 14-day free trial.
  The API is not a separately priced product: API access is part of the platform, and API rate
  limits (see rate-limits/) are the same defaults for every account.
currency: USD
billing_periods: [monthly, yearly]
trial:
  available: true
  length_days: 14
  card_required: unknown
plan_count: 4
plans:
  - name: Lead Tracking
    price: 50
    currency: USD
    period: month
    included:
      numbers: 5
      minutes: 250
    features:
      - Call & text tracking and attribution
      - Call recording and routing
      - Call transcription and analysis
      - Automation rules
    overage: >-
      "plus additional usage" — additional minutes and numbers beyond the plan allowance are billed
      on top of the base fee. Per-unit overage rates are not published on the pricing page.
  - name: Lead Tracking Complete
    price: 95
