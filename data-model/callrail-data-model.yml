attribution_model:
  note: >-
    Calls and form submissions carry a `milestones` object describing attribution per milestone.
    First-touch is the default for Source/Medium/Campaign/Referrer/Landing Page (2020-01-30);
    `last_touch` milestone data was added 2023-03-22 for calls and 2023-04-05 for form submissions.
    `gclid`/`fbclid` return the most valuable associated value regardless of first-touch source.
