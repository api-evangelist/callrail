- aid: callrail:mcp
  name: CallRail MCP Server
  description: >-
    CallRail's hosted Model Context Protocol server. Connects a CallRail account directly to AI
    assistants (Claude.ai, Claude Desktop, ChatGPT) over OAuth 2.0, exposing 36 tools — 22 read
    tools across accounts, calls, companies, conversations, form submissions, leads, SMS threads,
    tags, trackers and users, plus 14 write tools. Read-only by default. The server proxies the
    CallRail v3 REST API and scopes every response to the authenticated user's existing account
    permissions. The endpoint URL is issued per account by CallRail and is not published.
  humanURL: https://apidocs.callrail.com/#mcp
  baseURL: https://api.callrail.com/v3/
