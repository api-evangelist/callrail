related:
  - >-
    CallRail's MCP server authenticates with OAuth 2.0, but no RFC 8414
    /.well-known/oauth-authorization-server or RFC 9728 /.well-known/oauth-protected-resource
    document is reachable anonymously, because the MCP endpoint host is issued per account and is
    not published. See mcp/callrail-mcp.yml.
  - >-
    A vulnerability disclosure program exists at https://www.callrail.com/security/disclosure but
    is not advertised through /.well-known/security.txt. See
    security/callrail-vulnerability-disclosure.yml.
