postman:
  first_party: false
  note: >-
    The v3 docs teach the first request through Postman, but CallRail publishes no workspace of its
    own. The public "CallRail" Postman workspace (postman.com/postman-atlas/callrail, 16
    collections) is published by Postman's own Atlas team, not by CallRail, and two more are
    published by an unaffiliated individual. No Postman pointer is emitted for this provider.
